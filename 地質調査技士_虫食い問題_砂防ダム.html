<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地質調査技士 虫食い問題 砂防ダム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #f0f4f8;
    color: #1a2a3a;
    min-height: 100vh;
    padding-bottom: 100px;
  }
  header {
    background: #1a3a5c;
    color: white;
    padding: 16px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.05em; }
  header p { font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .controls {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: white;
    border-bottom: 1px solid #dde3ea;
    flex-wrap: wrap;
    justify-content: center;
    position: sticky;
    top: 57px;
    z-index: 99;
  }
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.95); }
  .btn-change { background: #1a3a5c; color: white; flex: 1; min-width: 90px; }
  .btn-reveal { background: #e8f0fe; color: #1a56db; flex: 1; min-width: 90px; }
  .btn-reset { background: #fdecea; color: #c0392b; flex: 1; min-width: 90px; }
  .hint {
    text-align: center;
    font-size: 12px;
    color: #6b7c93;
    padding: 8px 16px;
    background: #f9fafc;
    border-bottom: 1px solid #dde3ea;
  }
  .content { padding: 16px; max-width: 700px; margin: 0 auto; }
  .section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    font-size: 15px;
    line-height: 2.1;
  }
  .section.note {
    background: #f0f7ff;
    border: 1px solid #c5ddf5;
    font-size: 14px;
    color: #2c4a6e;
    line-height: 1.9;
  }
  .note-label {
    font-size: 11px;
    font-weight: 600;
    color: #1a56db;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .blank {
    display: inline-block;
    background: #1a3a5c;
    color: transparent;
    border-radius: 5px;
    cursor: pointer;
    padding: 2px 6px;
    min-width: 2em;
    text-align: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.2s, color 0.2s;
    touch-action: manipulation;
    font-weight: 600;
  }
  .blank.revealed {
    background: #e8f4fd;
    color: #1a56db;
    border: 1.5px solid #90c2f0;
  }
  .score-bar {
    text-align: center;
    font-size: 13px;
    color: #6b7c93;
    padding: 8px 16px 4px;
    max-width: 700px;
    margin: 0 auto;
  }
  .progress {
    height: 4px;
    background: #dde3ea;
    border-radius: 2px;
    margin: 6px 16px 0;
    max-width: 668px;
    margin-left: auto;
    margin-right: auto;
  }
  .progress-fill {
    height: 100%;
    background: #1a3a5c;
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }
</style>
</head>
<body>
<header>
  <h1>地質調査技士 虫食い問題</h1>
  <p>砂防ダムの地質調査</p>
</header>
<div class="controls">
  <button class="btn btn-change" onclick="changeBlank()">🔀 Change</button>
  <button class="btn btn-reveal" onclick="revealAll()">👁 全て表示</button>
  <button class="btn btn-reset" onclick="resetAll()">↩ リセット</button>
</div>
<div class="hint">青い部分をタップすると答えが現れます</div>
<div class="score-bar"><span id="score-text">0 / 0 確認済み</span></div>
<div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
<div class="content" id="content"></div>

<script>
const segments = [
  {text:"砂防ダムの",key:false,para:false},
  {text:"新設",key:true},
  {text:"が計画されている",key:false},
  {text:"小渓流",key:true},
  {text:"の地質調査。当該河床には",key:false},
  {text:"瀬戸川層群",key:true},
  {text:"の",key:false},
  {text:"含礫泥岩",key:true},
  {text:"が分布している。砂防ダム",key:false},
  {text:"袖部",key:true},
  {text:"予定となる河岸は",key:false},
  {text:"崩積土",key:true},
  {text:"に厚く覆われており、右岸側",key:false},
  {text:"切土法面",key:true},
  {text:"に露出している泥岩では著しい",key:false},
  {text:"スレーキング",key:true},
  {text:"進行が認められた。また、砂防ダム計画箇所の右岸側斜面は小規模に崩壊して",key:false},
  {text:"ガリー",key:true},
  {text:"が形成されていた。このままでは",key:false},
  {text:"雨水の供給",key:true},
  {text:"によって更に",key:false},
  {text:"崩壊が誘発",key:true},
  {text:"される恐れがあった。",key:false},

  {text:"河床部",key:true,para:true},
  {text:"支持力の確認、",key:false},
  {text:"岩盤の深度と分布範囲",key:true},
  {text:"を広く確認および",key:false},
  {text:"岩盤の掘削難易度",key:true},
  {text:"の推定、この3点に着目して調査を行った。河床部の支持力は",key:false},
  {text:"調査ボーリング",key:true},
  {text:"の実施によって確認できたため、両袖部において",key:false},
  {text:"地表踏査",key:true},
  {text:"と",key:false},
  {text:"簡易貫入試験",key:true},
  {text:"を実施し、岩盤の深度と分布範囲について",key:false},
  {text:"踏査地質図",key:true},
  {text:"に整理した。また、右岸側法面と河床部露頭において",key:false},
  {text:"簡易型弾性波試験",key:true},
  {text:"を実施し、",key:false},
  {text:"弾性波速度",key:true},
  {text:"から袖部岩盤の",key:false},
  {text:"支持力",key:true},
  {text:"及び",key:false},
  {text:"掘削難易度",key:true},
  {text:"の推定を行った。",key:false},

  {text:"調査ボーリング、地表踏査および簡易貫入試験、簡易型弾性波試験の実施によって、",key:false,para:true},
  {text:"支持層となる岩盤の分布",key:true},
  {text:"を複数の視点から",key:false},
  {text:"精度高く",key:true},
  {text:"、かつ計画位置の周辺も含めて確認することが出来た。さらに砂防ダム計画地点右岸側袖部に位置する",key:false},
  {text:"ガリー",key:true},
  {text:"は今後拡大して",key:false},
  {text:"崩壊する可能性が高い",key:true},
  {text:"為、砂防ダム計画位置を現行の計画よりも",key:false},
  {text:"下流側へ移動する",key:true},
  {text:"ことと袖部の",key:false},
  {text:"はめ込み深度",key:true},
  {text:"を調査結果から推定された",key:false},
  {text:"岩盤深度",key:true},
  {text:"に合わせることを提案した。",key:false},
];

const noteText = `潟湖（せきこ・かたこ）とは、もともとは海だった場所が、砂州（さす）や砂嘴（さし）などの砂の堆積によって外海から切り離されてできた湖のことです。`;

const keyIndices = segments.map((s,i)=>s.key?i:-1).filter(i=>i>=0);
let activeSet = [];
let revealed = new Set();

function pickSet() {
  const count = Math.ceil(keyIndices.length * 0.75);
  const shuffled = [...keyIndices].sort(()=>Math.random()-0.5);
  activeSet = shuffled.slice(0, count);
  revealed = new Set();
}

function render() {
  const content = document.getElementById('content');
  let sections = [];
  let current = [];
  segments.forEach((seg, i) => {
    if (seg.para && current.length > 0) { sections.push(current); current = []; }
    current.push({...seg, idx: i});
  });
  if (current.length) sections.push(current);

  let html = '';
  sections.forEach(sec => {
    html += '<div class="section">';
    sec.forEach(seg => {
      if (activeSet.includes(seg.idx)) {
        const isRev = revealed.has(seg.idx);
        html += `<span class="blank${isRev?' revealed':''}" id="b${seg.idx}" onclick="toggle(${seg.idx})">${seg.text}</span>`;
      } else {
        html += `<span>${seg.text}</span>`;
      }
    });
    html += '</div>';
  });

  html += `<div class="section note"><div class="note-label">用語メモ</div>${noteText}</div>`;

  content.innerHTML = html;
  updateScore();
}

function toggle(i) {
  revealed.has(i) ? revealed.delete(i) : revealed.add(i);
  const el = document.getElementById('b'+i);
  if (el) el.classList.toggle('revealed');
  updateScore();
}

function revealAll() { activeSet.forEach(i => revealed.add(i)); render(); }
function resetAll() { revealed = new Set(); render(); }
function changeBlank() { pickSet(); render(); }

function updateScore() {
  const total = activeSet.length;
  const done = revealed.size;
  document.getElementById('score-text').textContent = `${done} / ${total} 確認済み`;
  document.getElementById('progress-fill').style.width = (total > 0 ? done/total*100 : 0) + '%';
}

pickSet();
render();
</script>
</body>
</html>
