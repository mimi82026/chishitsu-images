<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>地質調査技士 二次試験問1対策</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: #0f1117;
  color: #e8ecf0;
  min-height: 100vh;
  padding-bottom: 80px;
}
header {
  background: #1a1f2e;
  border-bottom: 1px solid #2a3044;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 { font-size: 14px; font-weight: 700; color: #7eb8f7; letter-spacing: 0.08em; }
.page-indicator { font-size: 12px; color: #6b7c93; font-weight: 500; }
.rate-bar {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: #1a1f2e;
  border-bottom: 1px solid #2a3044;
  align-items: center;
  flex-wrap: wrap;
}
.rate-label { font-size: 12px; color: #6b7c93; margin-right: 4px; }
.rate-btn {
  padding: 6px 16px;
  border: 1.5px solid #2a3044;
  border-radius: 20px;
  background: transparent;
  color: #8899aa;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.rate-btn.active { background: #7eb8f7; border-color: #7eb8f7; color: #0f1117; }
.reset-btn {
  margin-left: auto;
  padding: 6px 14px;
  border: 1.5px solid #2a3044;
  border-radius: 20px;
  background: transparent;
  color: #8899aa;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.reset-btn:hover { border-color: #7eb8f7; color: #7eb8f7; }
.cards-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
.card {
  background: #1a1f2e;
  border: 1px solid #2a3044;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  display: none;
}
.card.active { display: block; }
.card-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #7eb8f7;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a3044;
}
.card-theme {
  font-size: 12px;
  color: #8899aa;
  margin-bottom: 16px;
  padding: 6px 10px;
  background: #0f1117;
  border-radius: 6px;
  border-left: 3px solid #7eb8f7;
}
.card-text { font-size: 15px; line-height: 2.1; color: #d0d8e4; }
.text-line { margin-bottom: 12px; }
.blank {
  display: inline-block;
  background: #7eb8f7;
  color: transparent;
  border-radius: 4px;
  cursor: pointer;
  padding: 1px 4px;
  min-width: 2em;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s;
  touch-action: manipulation;
  font-weight: 500;
  vertical-align: middle;
}
.blank.revealed {
  background: rgba(126,184,247,0.15);
  color: #7eb8f7;
  border: 1px solid #7eb8f7;
}
.nav-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #1a1f2e;
  border-top: 1px solid #2a3044;
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  justify-content: center;
}
.nav-btn {
  flex: 1;
  max-width: 180px;
  padding: 12px;
  border: 1.5px solid #2a3044;
  border-radius: 10px;
  background: transparent;
  color: #8899aa;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.nav-btn:active { transform: scale(0.97); }
.nav-btn.primary { background: #7eb8f7; border-color: #7eb8f7; color: #0f1117; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.complete-card { text-align: center; padding: 48px 24px; display: none; }
.complete-card.active { display: block; }
.complete-icon { font-size: 48px; margin-bottom: 16px; }
.complete-title { font-size: 20px; font-weight: 700; color: #7eb8f7; margin-bottom: 8px; }
.complete-sub { font-size: 14px; color: #6b7c93; margin-bottom: 32px; }
.restart-btn {
  padding: 14px 32px;
  background: #7eb8f7;
  color: #0f1117;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
</style>
</head>
<body>

<header>
  <h1>地質調査技士 二次試験問1対策</h1>
  <span class="page-indicator" id="page-indicator">1 / 3</span>
</header>

<div class="rate-bar">
  <span class="rate-label">穴埋め率：</span>
  <button class="rate-btn active" id="btn-rate-50" onclick="setRate(50)">50%</button>
  <button class="rate-btn" id="btn-rate-all" onclick="setRate('all')">ALL</button>
  <button class="reset-btn" onclick="resetAll()">全て隠す</button>
</div>

<div class="cards-wrap">
  <div class="card active" id="card-0">
    <div class="card-label">① 社会的責任 ＋ 顧客の信頼</div>
    <div class="card-theme">上記 1．2 の実現のために実践していること</div>
    <div class="card-text" id="text-0"></div>
  </div>
  <div class="card" id="card-1">
    <div class="card-label">② 社会的責任 ＋ 業の地位向上</div>
    <div class="card-theme">上記 1．3 の実現のために実践していること</div>
    <div class="card-text" id="text-1"></div>
  </div>
  <div class="card" id="card-2">
    <div class="card-label">③ 顧客の信頼 ＋ 業の地位向上</div>
    <div class="card-theme">上記 2．3 の実現のために実践していること</div>
    <div class="card-text" id="text-2"></div>
  </div>
  <div class="complete-card" id="card-complete">
    <div class="complete-icon">✅</div>
    <div class="complete-title">練習完了！</div>
    <div class="complete-sub">お疲れ様でした。<br>もう一度やり直しますか？</div>
    <button class="restart-btn" onclick="restart()">もう一度やる</button>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn" id="btn-prev" onclick="prevCard()" disabled>← 前へ</button>
  <button class="nav-btn primary" id="btn-next" onclick="nextCard()">次へ →</button>
</div>

<script>
// 各ページのテキストデータ（行単位の配列）
const texts = [
  // ① 
  [
    [{'t':"私は",'k':false},{'t':"業務開始前",'k':true},{'t':"に、",'k':false},{'t':"関係法令",'k':true},{'t':"や",'k':false},{'t':"仕様書",'k':true},{'t':"を",'k':false},{'t':"確認",'k':true},{'t':"し、",'k':false},{'t':"調査",'k':true},{'t':"の",'k':false},{'t':"目的",'k':true},{'t':"や",'k':false},{'t':"注意点",'k':true},{'t':"を",'k':false},{'t':"整理",'k':true},{'t':"してから",'k':false},{'t':"作業",'k':true},{'t':"に入っている。",'k':false}],
    [{'t':"現",'k':false},{'t':"地調査",'k':true},{'t':"では",'k':false},{'t':"安全確保",'k':true},{'t':"と",'k':false},{'t':"周辺環境",'k':true},{'t':"への",'k':false},{'t':"配慮",'k':true},{'t':"を",'k':false},{'t':"意識",'k':true},{'t':"し、",'k':false},{'t':"観察結果",'k':true},{'t':"や",'k':false},{'t':"測定値",'k':true},{'t':"を",'k':false},{'t':"その場",'k':true},{'t':"で",'k':false},{'t':"正確",'k':true},{'t':"に",'k':false},{'t':"記録",'k':true},{'t':"している。",'k':false}],
    [{'t':"成果整理",'k':true},{'t':"の際には",'k':false},{'t':"既往資料",'k':true},{'t':"との",'k':false},{'t':"整合",'k':true},{'t':"を",'k':false},{'t':"確認",'k':true},{'t':"し、",'k':false},{'t':"分かりやすい表現",'k':true},{'t':"を",'k':false},{'t':"心掛ける",'k':true},{'t':"ことで、",'k':false},{'t':"社会的責任",'k':true},{'t':"を果たし",'k':false},{'t':"顧客の信頼",'k':true},{'t':"に",'k':false},{'t':"応える",'k':true},{'t':"よう努めている。",'k':false}],
  ],
  // ②
  [
    [{'t':"私は",'k':false},{'t':"法令遵守",'k':true},{'t':"と",'k':false},{'t':"環境への影響",'k':true},{'t':"を",'k':false},{'t':"意識した調査",'k':true},{'t':"を行い、",'k':false},{'t':"自らの判断",'k':true},{'t':"や",'k':false},{'t':"作業内容",'k':true},{'t':"に",'k':false},{'t':"責任を持つこと",'k':true},{'t':"を心掛けている。",'k':false}],
    [{'t':"調",'k':false},{'t':"査結果",'k':true},{'t':"については",'k':false},{'t':"周辺事例",'k':true},{'t':"や",'k':false},{'t':"既往調査",'k':true},{'t':"と",'k':false},{'t':"比較",'k':true},{'t':"し、",'k':false},{'t':"妥当性",'k':true},{'t':"を",'k':false},{'t':"確認",'k':true},{'t':"している。",'k':false}],
    [{'t':"また、",'k':false},{'t':"講習会への参加",'k':true},{'t':"や",'k':false},{'t':"資料の整理",'k':true},{'t':"を通じて",'k':false},{'t':"専門知識の理解",'k':true},{'t':"を深め、",'k':false},{'t':"技術力の向上",'k':true},{'t':"を図ることで、",'k':false},{'t':"地質調査業",'k':true},{'t':"の",'k':false},{'t':"信頼性向上",'k':true},{'t':"に",'k':false},{'t':"貢献",'k':true},{'t':"したいと考えている。",'k':false}],
  ],
  // ③
  [
    [{'t':"私は",'k':false},{'t':"顧客との打合せ内容",'k':true},{'t':"を",'k':false},{'t':"整理",'k':true},{'t':"し、",'k':false},{'t':"調査目的",'k':true},{'t':"や",'k':false},{'t':"要望",'k':true},{'t':"を",'k':false},{'t':"正確に把握したうえ",'k':true},{'t':"で業務を進めている。",'k':false}],
    [{'t':"成",'k':false},{'t':"果作成",'k':true},{'t':"では",'k':false},{'t':"上司や同僚",'k':true},{'t':"の確認を受け、",'k':false},{'t':"指摘事項",'k':true},{'t':"を",'k':false},{'t':"次の業務",'k':true},{'t':"に活かしている。",'k':false}],
    [{'t':"また、",'k':false},{'t':"業務で知り得た情報",'k':true},{'t':"は",'k':false},{'t':"適切に管理",'k':true},{'t':"し、",'k':false},{'t':"日々の技術研鑽",'k':true},{'t':"と",'k':false},{'t':"誠実な対応",'k':true},{'t':"を",'k':false},{'t':"積み重ねる",'k':true},{'t':"ことで、",'k':false},{'t':"顧客の信頼",'k':true},{'t':"と",'k':false},{'t':"業の地位向上",'k':true},{'t':"につなげている。",'k':false}],
  ],
];

let currentRate = 50;
let currentPage = 0;
// [pageIdx][lineIdx] → [セグメントインデックス配列]
let activeBlankSets = texts.map(page => page.map(() => []));
let revealed = texts.map(page => page.map(() => new Set()));

function getKeyIndices(pageIdx, lineIdx) {
  return texts[pageIdx][lineIdx].map((s,i) => s.k ? i : -1).filter(i => i >= 0);
}

function pickBlanks(pageIdx, lineIdx, rate) {
  const keys = getKeyIndices(pageIdx, lineIdx);
  if (rate === 'all') return keys;
  const count = Math.max(1, Math.round(keys.length * rate / 100));
  const shuffled = [...keys].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count).sort((a,b) => a-b);
}

function renderText(pageIdx) {
  const el = document.getElementById('text-' + pageIdx);
  let html = '';
  texts[pageIdx].forEach((lineSegs, lineIdx) => {
    const actives = activeBlankSets[pageIdx][lineIdx];
    const rev = revealed[pageIdx][lineIdx];
    html += '<div class="text-line">';
    lineSegs.forEach((seg, i) => {
      if (actives.includes(i)) {
        const isRev = rev.has(i);
        html += `<span class="blank${isRev?' revealed':''}" onclick="toggle(${pageIdx},${lineIdx},${i})">${seg.t}</span>`;
      } else {
        html += `<span>${seg.t}</span>`;
      }
    });
    html += '</div>';
  });
  el.innerHTML = html;
}

function toggle(pageIdx, lineIdx, i) {
  const rev = revealed[pageIdx][lineIdx];
  if (rev.has(i)) { rev.delete(i); } else { rev.add(i); }
  renderText(pageIdx);
}

function setRate(rate) {
  currentRate = rate;
  document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
  if (rate === 50) document.getElementById('btn-rate-50').classList.add('active');
  else if (rate === 99.9) document.getElementById('btn-rate-99').classList.add('active');
  else if (rate === 'all') document.getElementById('btn-rate-all').classList.add('active');

  for (let p = 0; p < 3; p++) {
    for (let l = 0; l < texts[p].length; l++) {
      activeBlankSets[p][l] = pickBlanks(p, l, rate);
      revealed[p][l] = new Set();
    }
    renderText(p);
  }
}

function resetAll() {
  for (let l = 0; l < texts[currentPage].length; l++) {
    revealed[currentPage][l] = new Set();
  }
  renderText(currentPage);
}

function showPage(idx) {
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  document.getElementById('card-complete').classList.remove('active');
  document.getElementById('page-indicator').textContent = `${idx + 1} / 3`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').textContent = idx === 2 ? '完了 ✓' : '次へ →';
  document.getElementById('btn-next').disabled = false;
}

function prevCard() { if (currentPage > 0) { currentPage--; showPage(currentPage); } }

function nextCard() {
  if (currentPage < 2) { currentPage++; showPage(currentPage); }
  else {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById('card-complete').classList.add('active');
    document.getElementById('page-indicator').textContent = '完了';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
  }
}

function restart() {
  currentPage = 0;
  revealed = texts.map(page => page.map(() => new Set()));
  for (let p = 0; p < 3; p++) renderText(p);
  showPage(0);
}

// 初期化
setRate(50);
</script>
</body>
</html>
