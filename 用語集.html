<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地質調査技士 用語集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; background: #f5f5f0; color: #222; }

  /* 一覧ページ */
  #list-page { display: block; padding: 1.5rem 1rem; max-width: 700px; margin: 0 auto; }
  #list-page h1 { font-size: 1.3rem; font-weight: 500; margin-bottom: 1.2rem; text-align: center; color: #333; }

  .kana-group { margin-bottom: 1.2rem; }
  .kana-label { font-size: 0.85rem; color: #888; font-weight: 500; padding: 0.2rem 0.5rem; border-left: 3px solid #7F77DD; margin-bottom: 0.5rem; }
  .term-list { display: flex; flex-direction: column; gap: 0.3rem; }
  .term-item {
    background: #fff;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    padding: 0.6rem 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    transition: background 0.15s;
  }
  .term-item:hover { background: #EEEDFE; }
  .term-num { font-size: 0.75rem; color: #aaa; min-width: 24px; }
  .term-name { font-size: 0.95rem; }

  /* カードページ */
  #card-page { display: none; padding: 1rem; max-width: 700px; margin: 0 auto; }
  .card-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1rem; }
  .back-btn {
    background: #fff;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    padding: 0.4rem 0.9rem;
    cursor: pointer;
    font-size: 0.9rem;
    color: #555;
  }
  .back-btn:hover { background: #f0f0f0; }
  .card-title { font-size: 1rem; font-weight: 500; color: #333; }
  .card-image-wrap {
    background: #fff;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
  }
  .card-image-wrap img {
    width: 100%;
    max-width: 100%;
    display: block;
  }
  .card-nav { display: flex; justify-content: space-between; margin-top: 1rem; gap: 0.5rem; }
  .nav-btn {
    background: #fff;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    cursor: pointer;
    font-size: 0.9rem;
    color: #555;
    flex: 1;
  }
  .nav-btn:hover { background: #EEEDFE; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div id="list-page">
  <h1>地質調査技士 用語集</h1>
  <div id="term-groups"></div>
</div>

<div id="card-page">
  <div class="card-header">
    <button class="back-btn" onclick="showList()">← 一覧に戻る</button>
    <span class="card-title" id="card-title"></span>
  </div>
  <div class="card-image-wrap">
    <img id="card-img" src="" alt="">
  </div>
  <div class="card-nav">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← 前の用語</button>
    <button class="nav-btn" id="btn-next" onclick="navigate(1)">次の用語 →</button>
  </div>
</div>

<script>
const terms = [
  { kana: 'あ', num: 1,  name: '圧密試験' },
  { kana: 'あ', num: 2,  name: '圧密沈下' },
  { kana: 'い', num: 3,  name: '一軸圧縮試験' },
  { kana: 'え', num: 4,  name: '液状化' },
  { kana: 'え', num: 5,  name: '液状化強度比RL₂₀' },
  { kana: 'お', num: 6,  name: '音波検層' },
  { kana: 'か', num: 7,  name: '過圧密粘土' },
  { kana: 'か', num: 8,  name: '間隙水圧' },
  { kana: 'が', num: 9,  name: '岩石試験' },
  { kana: 'が', num: 10, name: '岩盤分類' },
  { kana: 'く', num: 11, name: 'クリノメーター' },
  { kana: 'け', num: 12, name: 'ケーシング' },
  { kana: 'げ', num: 13, name: '現場透水試験' },
  { kana: 'こ', num: 14, name: 'コア採取' },
  { kana: 'こ', num: 15, name: '孔内水平載荷試験' },
  { kana: 'こ', num: 16, name: '孔曲がり' },
  { kana: 'こ', num: 17, name: '固定ピストン式シンウォールサンプラー' },
  { kana: 'こ', num: 18, name: 'コンシステンシー限界' },
  { kana: 'さ', num: 19, name: '砂質土' },
  { kana: 'さ', num: 20, name: '三軸圧縮試験' },
  { kana: 'し', num: 21, name: '支持力' },
  { kana: 'し', num: 22, name: '室内土質試験' },
  { kana: 'し', num: 23, name: '斜面崩壊' },
  { kana: 'し', num: 24, name: '試料採取（サンプリング）' },
  { kana: 'じ', num: 25, name: '地すべり' },
  { kana: 'じ', num: 26, name: '地盤改良' },
  { kana: 'じ', num: 27, name: '地盤調査' },
  { kana: 'じ', num: 28, name: '地盤沈下' },
  { kana: 'す', num: 29, name: '水位観測（地下水位観測孔）' },
  { kana: 'せ', num: 30, name: 'せん断強度' },
  { kana: 'だ', num: 31, name: '弾性波探査' },
  { kana: 'ち', num: 32, name: '地下水調査' },
  { kana: 'ち', num: 33, name: '地形判読' },
  { kana: 'ち', num: 34, name: '地質調査業者登録規程' },
  { kana: 'ち', num: 35, name: '地質リスク' },
  { kana: 'ち', num: 36, name: '地中レーダ探査' },
  { kana: 'つ', num: 37, name: '土の分類' },
  { kana: 'で', num: 38, name: '泥水管理' },
  { kana: 'で', num: 39, name: '電気検層' },
  { kana: 'と', num: 40, name: '透水試験' },
  { kana: 'ど', num: 41, name: '土壌汚染調査' },
  { kana: 'ね', num: 42, name: '粘性土' },
  { kana: 'は', num: 43, name: '廃棄物処理法' },
  { kana: 'ひ', num: 44, name: '標準貫入試験（SPT）' },
  { kana: 'ひ', num: 45, name: '品質マネジメントシステム（ISO 9001）' },
  { kana: 'び', num: 46, name: '微動アレイ探査' },
  { kana: 'ぶ', num: 47, name: '物理探査' },
  { kana: 'ぷ', num: 48, name: 'プロポーザル方式' },
  { kana: 'へ', num: 49, name: '平板載荷試験' },
  { kana: 'ぼ', num: 50, name: 'ボーリング調査' },
  { kana: 'も', num: 51, name: 'モールの応力円' },
  { kana: 'ゆ', num: 52, name: '有効応力' },
  { kana: 'よ', num: 53, name: '揚水試験' },
  { kana: 'り', num: 54, name: '粒度試験' },
  { kana: 'れ', num: 55, name: '礫質土' },
  { kana: 'B',  num: 56, name: 'BIM/CIM' },
  { kana: 'H',  num: 57, name: 'HSP' },
  { kana: 'N',  num: 58, name: 'N値' },
  { kana: 'P',  num: 59, name: 'PS検層' },
  { kana: 'R',  num: 60, name: 'RQD' },
  { kana: 'T',  num: 61, name: 'TECRIS' },
];

const BASE_URL = 'https://mimi82026.github.io/chishitsu-images/cards/';

let currentIndex = 0;

function pad(n) { return String(n).padStart(2, '0'); }

function buildList() {
  const groups = {};
  terms.forEach((t, i) => {
    if (!groups[t.kana]) groups[t.kana] = [];
    groups[t.kana].push({ ...t, index: i });
  });
  const container = document.getElementById('term-groups');
  Object.entries(groups).forEach(([kana, items]) => {
    const div = document.createElement('div');
    div.className = 'kana-group';
    div.innerHTML = `<div class="kana-label">${kana}</div><div class="term-list"></div>`;
    const list = div.querySelector('.term-list');
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'term-item';
      el.innerHTML = `<span class="term-num">${item.num}</span><span class="term-name">${item.name}</span>`;
      el.onclick = () => showCard(item.index);
      list.appendChild(el);
    });
    container.appendChild(div);
  });
}

function showCard(index) {
  currentIndex = index;
  const t = terms[index];
  document.getElementById('card-title').textContent = t.name;
  document.getElementById('card-img').src = BASE_URL + pad(t.num) + '.jpg';
  document.getElementById('card-img').alt = t.name;
  document.getElementById('btn-prev').disabled = index === 0;
  document.getElementById('btn-next').disabled = index === terms.length - 1;
  document.getElementById('list-page').style.display = 'none';
  document.getElementById('card-page').style.display = 'block';
  window.scrollTo(0, 0);
}

function showList() {
  document.getElementById('card-page').style.display = 'none';
  document.getElementById('list-page').style.display = 'block';
}

function navigate(dir) {
  const next = currentIndex + dir;
  if (next >= 0 && next < terms.length) showCard(next);
}

buildList();
</script>
</body>
</html>
